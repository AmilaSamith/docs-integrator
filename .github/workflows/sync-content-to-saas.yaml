name: Sync shared content to saas

# Phase 6 -- shared/hosting-model-agnostic content flows from
# wso2-integrator (the source of truth) to saas as a reviewed bot PR,
# never auto-merged. Same "accept duplication, automate sync" pattern
# as sync-theme.yaml, applied to docs content instead of theme/chrome.
#
# Targets `saas`, not `main`: main is still the untouched pre-revamp
# branch, saas is where active development actually happens. Repoint
# `--base` (and the trigger comment below) at `main` once saas has been
# force-pushed there and main becomes the live development branch.
#
# Synced: platform-overview/, editor/, develop-and-test/, migrate/,
# guides/ -- nothing else.
#
# Images are synced by reference, not by folder: en/static/img/ folders
# don't map 1:1 onto doc sections (develop/, workflows/, reference/ are
# shared with saas-only sections like get-started/ and icp/), so a
# folder-level replace would delete images saas's own pages still use.
# Instead: every /img/... path the synced docs reference is checked out
# from wso2-integrator -- unless saas's copy was edited on saas more
# recently, in which case it's kept and a warning logged -- and images
# the synced docs used to reference but no longer do are removed --
# unless something else on saas (any doc, versioned_docs/, src/,
# docusaurus.config.ts) still references them.
#
# Carved out of develop-and-test/: create-workspace/ is authored
# independently on saas (see SAAS_OWNED_DIRS). The sync restores saas's copy
# after the full replace and skips it when collecting image references, so
# the self-hosted screenshots it used on this branch are never synced and
# saas's own screenshots (create-project/, import-project/, explore-samples/
# `*-saas-*` files) are never touched. The shared-content-guard on saas
# excludes the same path.
#
# Carved out of editor/: integration-control-plane.md documents the local ICP
# server, which is self-hosted only, so it is listed in SYNC_EXCLUDE_FILES and
# removed after the replace (and so never drives image syncing either).
#
# NOT synced (deliberately): deploy-and-run/, observe/, manage/, icp/,
# get-started/, reference/ -- hosting-model-specific, authored
# independently per branch. connectors/ isn't a folder here at all
# (lives on its own wso2-connectors branch, referenced by link, not
# synced). Agent Builder is parked, no sync target exists yet.

on:
  push:
    branches: [wso2-integrator]
    paths:
      - 'en/docs/platform-overview/**'
      - 'en/docs/editor/**'
      - 'en/docs/develop-and-test/**'
      - '!en/docs/develop-and-test/create-workspace/**'
      - '!en/docs/editor/integration-control-plane.md'
      - 'en/docs/migrate/**'
      - 'en/docs/guides/**'
      - 'en/static/img/**'
  workflow_dispatch:

# One sync at a time; a newer push supersedes a queued one.
concurrency:
  group: sync-content-to-saas
  cancel-in-progress: false

env:
  SYNC_BRANCH: sync-content-saas
  SYNC_DIRS: >-
    en/docs/platform-overview
    en/docs/editor
    en/docs/develop-and-test
    en/docs/migrate
    en/docs/guides
  # Authored independently on saas (WSO2 Cloud create/import project,
  # import integration, and sample flows), so never overwritten by a sync.
  SAAS_OWNED_DIRS: >-
    en/docs/develop-and-test/create-workspace
  # Self-hosted-only pages inside synced folders, never copied to saas.
  SYNC_EXCLUDE_FILES: >-
    en/docs/editor/integration-control-plane.md

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push shared content to saas
        run: |
          git config user.name "Docs Bot"
          git config user.email "docs@wso2.com"

          git fetch origin wso2-integrator saas
          # Fixed branch name: every run rebuilds it from the current saas, so it
          # always carries the full, latest diff (a superset of any earlier run's)
          # and one open PR is updated in place instead of a new one per push.
          git fetch origin "$SYNC_BRANCH" 2>/dev/null || true
          git checkout -B "$SYNC_BRANCH" origin/saas

          # comm needs both inputs sorted the same way.
          export LC_ALL=C

          # Matches both `/img/...` and relative `../static/img/...` refs,
          # normalised to `/img/...`.
          # create-workspace/ is skipped: its docs are saas-owned, so the
          # images they reference must not drive the sync in either direction.
          list_img_refs() {
            grep -rhoE --exclude-dir=create-workspace "/img/[^)\"' >]+" "$@" 2>/dev/null | sort -u || true
          }

          # Captured before the docs are replaced: images saas's current
          # copy of the synced docs uses -- the stale-cleanup candidates.
          list_img_refs $SYNC_DIRS > "$RUNNER_TEMP/old-refs"

          # Full replace, not overlay: `git checkout <ref> -- <path>` only
          # adds/updates files present in <ref> -- it never removes a path
          # that exists on saas but not on wso2-integrator. Clear each
          # shared directory first so a removal on wso2-integrator
          # actually propagates.
          for d in $SYNC_DIRS; do
            rm -rf "$d"
            git checkout origin/wso2-integrator -- "$d" 2>/dev/null || true
          done

          # Drop wso2-integrator-only pages that live inside synced folders.
          for f in $SYNC_EXCLUDE_FILES; do
            rm -f "$f"
          done

          # Put saas's copy of the saas-owned directories back, before any
          # image refs are collected. Only if it exists on saas, so a missing
          # directory never gets wiped by this step.
          for d in $SAAS_OWNED_DIRS; do
            if git cat-file -e "origin/saas:$d" 2>/dev/null; then
              rm -rf "$d"
              git checkout origin/saas -- "$d"
            fi
          done

          # Bring over the latest copy of every image the synced docs
          # reference. Refs with no file on wso2-integrator are already
          # broken there -- warn, don't fail the sync over them.
          list_img_refs $SYNC_DIRS > "$RUNNER_TEMP/new-refs"
          git ls-tree -r --name-only origin/wso2-integrator -- en/static/img \
            | sed 's#^en/static##' | sort -u > "$RUNNER_TEMP/source-imgs"
          comm -12 "$RUNNER_TEMP/new-refs" "$RUNNER_TEMP/source-imgs" \
            | sed 's#^#en/static#' > "$RUNNER_TEMP/to-checkout"
          comm -23 "$RUNNER_TEMP/new-refs" "$RUNNER_TEMP/source-imgs" \
            | while read -r p; do
                echo "::warning::$p is referenced by synced docs but missing on wso2-integrator"
              done

          # Latest wins, per file: if an image differs between the branches
          # and saas's copy was edited on saas (by anything other than a
          # previous sync) more recently than wso2-integrator's, keep saas's
          # copy and warn instead of overwriting it.
          git ls-tree -r origin/saas -- en/static/img | awk '{print $4"\t"$3}' | sort > "$RUNNER_TEMP/saas-blobs"
          git ls-tree -r origin/wso2-integrator -- en/static/img | awk '{print $4"\t"$3}' | sort > "$RUNNER_TEMP/source-blobs"
          join -t "$(printf '\t')" "$RUNNER_TEMP/saas-blobs" "$RUNNER_TEMP/source-blobs" \
            | awk -F '\t' '$2 != $3 {print $1}' > "$RUNNER_TEMP/differing"
          : > "$RUNNER_TEMP/keep-saas"
          comm -12 "$RUNNER_TEMP/to-checkout" "$RUNNER_TEMP/differing" \
            | while read -r f; do
                saas_ts=$(git log -1 --format=%ct -F --invert-grep --grep='content(sync)' origin/saas -- "$f")
                src_ts=$(git log -1 --format=%ct origin/wso2-integrator -- "$f")
                if [ -n "$saas_ts" ] && [ "$saas_ts" -gt "$src_ts" ]; then
                  echo "::warning::kept saas copy of $f -- edited on saas after wso2-integrator's version"
                  echo "$f" >> "$RUNNER_TEMP/keep-saas"
                fi
              done
          sort -o "$RUNNER_TEMP/keep-saas" "$RUNNER_TEMP/keep-saas"
          comm -23 "$RUNNER_TEMP/to-checkout" "$RUNNER_TEMP/keep-saas" > "$RUNNER_TEMP/to-checkout.final"
          mv "$RUNNER_TEMP/to-checkout.final" "$RUNNER_TEMP/to-checkout"

          if [ -s "$RUNNER_TEMP/to-checkout" ]; then
            git checkout origin/wso2-integrator \
              --pathspec-from-file="$RUNNER_TEMP/to-checkout" --
          fi

          # Drop images the synced docs stopped referencing, but only if
          # nothing on saas still uses them.
          list_img_refs en/docs en/versioned_docs en/src en/docusaurus.config.ts > "$RUNNER_TEMP/still-used"
          comm -23 "$RUNNER_TEMP/old-refs" "$RUNNER_TEMP/still-used" \
            | while read -r p; do
                git rm -q --ignore-unmatch -- "en/static$p"
              done

          git add -A -- $SYNC_DIRS en/static/img

          if git diff --cached --quiet; then
            echo "No content changes to sync."
            exit 0
          fi

          git commit -m "content(sync): shared docs from wso2-integrator ($(date +%Y-%m-%d))"

          open_pr=$(gh pr list --base saas --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number')

          # An open sync PR already carries exactly this content: leave it alone.
          # (Only checked while a PR is open, so a leftover branch from a merged
          # PR never suppresses a new one.)
          if [ -n "$open_pr" ] \
             && git rev-parse --verify -q "origin/$SYNC_BRANCH" >/dev/null \
             && git diff --quiet "origin/$SYNC_BRANCH" HEAD; then
            echo "Open sync PR #$open_pr is already up to date."
            exit 0
          fi

          # Bot-owned branch, rebuilt each run, so a force push is intended.
          git push --force origin "HEAD:$SYNC_BRANCH"

          # Reuse the open sync PR if there is one (the push above updated it).
          if [ -n "$open_pr" ]; then
            echo "Updated sync PR #$open_pr."
            exit 0
          fi

          gh pr create --base saas --head "$SYNC_BRANCH" \
            --title "content(sync): shared docs from wso2-integrator" \
            --body $'Auto-synced shared content (platform-overview, editor, develop-and-test, migrate, guides, plus every en/static/img/ file they reference) from wso2-integrator. develop-and-test/create-workspace/ is saas-owned and is not synced. Check the run log for warnings about referenced images missing on wso2-integrator.\n\n**Review before merging, do not auto-merge.** In particular:\n- `editor/views/integration-view.md`, `editor/views/project-view.md`, and `editor/integrator-app.md` carry intentional saas-specific divergence (Cloud-only deploy options panel, no ICP status-bar item -- see the NOTE comments in each file). If this PR\'s diff re-adds the VM/Containerized/ICP options or the ICP status bar row to these files, that\'s this sync clobbering the saas-specific override -- revert those hunks before merging, don\'t accept them as-is.\n- Any other saas-specific edit inside a synced folder will show the same way: as this PR reverting it. Check for NOTE-style comments before accepting a hunk that removes one.\n- The same goes for images: if saas intentionally carries its own version of a screenshot the synced docs reference, this PR keeps saas\'s copy only if it was edited on saas after wso2-integrator\'s version (see the "kept saas copy" warnings in the run log); otherwise it overwrites it -- revert that file before merging if the saas copy should win.' \
            --label "content-sync"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
