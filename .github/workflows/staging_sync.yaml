name: Staging Sync

# Keeps the `staging` branch as a continuously-updated, merged preview of
# all product branches together -- the input to whatever hosts staging
# (Choreo). Mirrors production's own per-branch publish structure (see
# publish_docs.yaml on each branch) but targets `staging` instead of
# `gh-pages`, and fires on every push to a product branch directly,
# instead of waiting for a promotion event.
#
# This file is intentionally IDENTICAL on every product branch -- it
# reads `github.ref_name` at runtime to pick the right BASE_URL, so
# there is nothing branch-specific to hand-edit. It's authored on `main`
# (see MAINTENANCE.md) and distributed to every product branch by the
# same shared-sync automation that distributes the shared theme. The one
# time you DO edit it: adding a new product branch to the trigger list
# and the case statement below when that product launches.
#
# Deliberately does NOT deploy to production. See promote_to_production.yaml
# (lives on `main`) for that half of the pipeline.

on:
  push:
    branches:
      - saas
      - wso2-integrator
      - wso2-connectors
      # - wso2-agent-builder   # add when this product launches
  workflow_dispatch:

concurrency:
  group: staging-deploy
  cancel-in-progress: false

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve this branch's BASE_URL
        id: cfg
        run: |
          case "${{ github.ref_name }}" in
            saas)
              echo "base_url=/integration-platform/docs/" >> "$GITHUB_OUTPUT"
              ;;
            wso2-integrator)
              echo "base_url=/integration-platform/docs/integrator/" >> "$GITHUB_OUTPUT"
              ;;
            wso2-connectors)
              echo "base_url=/integration-platform/docs/connectors/" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::No staging config for branch '${{ github.ref_name }}' -- add it to this case statement and to the trigger list above."
              exit 1
              ;;
          esac

      - name: Build Docusaurus site
        run: npm run build
        env:
          BASE_URL: ${{ steps.cfg.outputs.base_url }}

      # Same `keep_files: true` reasoning as publish_docs.yaml: without it,
      # peaceiris wipes the whole `staging` branch before each deploy,
      # deleting whatever the other product branches already published
      # there. Three near-identical deploy steps (not one parametrized
      # step) because peaceiris's `destination_dir` input can't be made
      # conditionally empty for saas's root deploy from inside one step.

      - name: Deploy saas (root of staging)
        if: github.ref_name == 'saas'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: staging
          publish_dir: en/build
          keep_files: true

      - name: Deploy wso2-integrator (staging/integrator)
        if: github.ref_name == 'wso2-integrator'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: staging
          publish_dir: en/build
          destination_dir: integrator
          keep_files: true

      - name: Deploy wso2-connectors (staging/connectors)
        if: github.ref_name == 'wso2-connectors'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: staging
          publish_dir: en/build
          destination_dir: connectors
          keep_files: true
