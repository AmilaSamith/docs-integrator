name: WSO2 Cloud Docs Publish

# Publishes this branch's site at the root of the shared gh-pages branch
# (/integration-platform/docs/), alongside wso2-integrator (/integrator/)
# and wso2-connectors (/connectors/). See docs-integrator's Docs Repo &
# Branch Strategy for the full multi-branch publish design.
#
# Triggers on push to `main`, not `saas` -- saas is the working branch;
# production only sees it once it's force-pushed onto main. Until that
# force-push happens, this workflow simply never fires from this branch's
# own commits, matching the current (pre-multi-branch) publish behavior
# where only main deploys.
#
# keep_files: true is load-bearing -- without it, peaceiris wipes the
# entire gh-pages branch before each deploy, deleting whatever the other
# two branches' workflows published. The shared concurrency group prevents
# two of these three workflows from racing to push gh-pages at once.

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  release-wso2-cloud-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus site
        run: npm run build
        env:
          BASE_URL: /integration-platform/docs/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: en/build
          keep_files: true
