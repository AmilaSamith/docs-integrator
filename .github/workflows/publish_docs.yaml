name: WSO2 Connectors Docs Publish

# Publishes this branch's site under /integration-platform/docs/connectors/
# on the shared gh-pages branch, alongside saas (root) and wso2-integrator
# (/integrator/). See docs-integrator's Docs Repo & Branch Strategy for the
# full multi-branch publish design.
#
# keep_files: true is load-bearing -- without it, peaceiris wipes the
# entire gh-pages branch before each deploy, deleting whatever the other
# two branches' workflows published. The shared concurrency group prevents
# two of these three workflows from racing to push gh-pages at once.

on:
  push:
    branches:
      - wso2-connectors
  workflow_dispatch:

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  release-wso2-connectors-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Docusaurus site
        run: npm run build
        env:
          BASE_URL: /integration-platform/docs/connectors/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: en/build
          destination_dir: connectors
          keep_files: true
