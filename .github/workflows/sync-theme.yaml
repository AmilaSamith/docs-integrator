name: Sync shared theme to site branches

# Propagates the shared visual identity (see en/src/theme-shared/themeConfig.ts)
# from wso2-integrator, the canonical branch, to every other site branch —
# same "accept duplication, automate sync" pattern as the docs content sync,
# applied to theme/chrome instead of documentation content. Per the branch
# rule (Docs Repo & Branch Strategy §5): this is evergreen, decoupled-from-
# content configuration, so it travels like the connectors catalog, not
# like per-branch documentation.
#
# Add a branch to the matrix below to bring it into the shared-theme
# contract (e.g. wso2-agent-builder once un-parked, or main once it needs
# SiteNav/TabAwareToc/ProductDocsLinks too).

on:
  push:
    branches: [wso2-integrator]
    paths:
      - 'en/src/theme-shared/**'
      - 'en/src/theme/**'
      - 'en/src/plugins/expose-sidebars/**'
      - 'en/src/components/SiteNav/**'
      - 'en/src/components/TabAwareToc/**'
      - 'en/src/components/ProductDocsLinks/**'
      - 'en/src/css/custom.css'
      - 'en/static/img/**'
      - 'en/plugins/docusaurus-plugin-markdown-export/**'
  workflow_dispatch:

env:
  SHARED_PATHS: >-
    en/src/theme-shared
    en/src/theme
    en/src/plugins/expose-sidebars
    en/src/components/SiteNav
    en/src/components/TabAwareToc
    en/src/components/ProductDocsLinks
    en/src/css/custom.css
    en/static/img
    en/plugins/docusaurus-plugin-markdown-export

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wso2-connectors, saas]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push shared theme files to ${{ matrix.target }}
        run: |
          git config user.name "Docs Bot"
          git config user.email "docs@wso2.com"

          git fetch origin wso2-integrator ${{ matrix.target }}
          git checkout -b sync-theme-${{ matrix.target }} origin/${{ matrix.target }}

          # Full replace, not overlay: `git checkout <ref> -- <path>` only
          # adds/updates files present in <ref> — it never removes a path
          # that exists on the target but not on wso2-integrator. Since
          # these directories are meant to be wholly owned by the shared
          # contract (no target-specific files inside them), clear each
          # one first so a removal on wso2-integrator actually propagates.
          for p in $SHARED_PATHS; do
            if [ -d "$p" ]; then
              rm -rf "$p"
            fi
            git checkout origin/wso2-integrator -- "$p" 2>/dev/null || true
          done

          git add -A -- $SHARED_PATHS

          if git diff --cached --quiet; then
            echo "No theme changes to sync to ${{ matrix.target }}."
            exit 0
          fi

          git commit -m "theme(sync): shared theme from wso2-integrator ($(date +%Y-%m-%d))"
          git push origin sync-theme-${{ matrix.target }}

          gh pr create --base ${{ matrix.target }} --head sync-theme-${{ matrix.target }} \
            --title "theme(sync): shared theme from wso2-integrator" \
            --body "Auto-synced shared theme files (custom.css, theme overrides, SiteNav, ProductDocsLinks, TabAwareToc, expose-sidebars, markdown-export, brand assets). Review for ${{ matrix.target }}-specific breakage before merge."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
