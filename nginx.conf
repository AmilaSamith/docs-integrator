server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # This site is a Docusaurus build with trailingSlash:false -- every
        # leaf page is a flat <name>.html file (e.g. connector-overview.html),
        # NOT <name>/index.html. Only the three product roots (saas/,
        # integrator/, connectors/) happen to have a real index.html, since
        # that's the one route Docusaurus always emits as index.html
        # regardless of trailingSlash. Try the exact file, then the clean-URL
        # ".html" form, then a directory's own index.html (covers the product
        # roots), then each product's own 404.html if nothing matches.
        try_files $uri $uri.html $uri/index.html =404;
    }
}
